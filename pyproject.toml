[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sv-pgs"
version = "0.1.0"
description = "Bayesian polygenic scores with structural variants, tandem repeats and SNVs in one model"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
# The supported platform, stated once here and in the README: Linux on CPython 3.12, which is what the MSI suite
# (3.12.13) and the CI workflow run. sv_pgs reads /proc and os.sched_getaffinity (compute_budget, dosage_store,
# progress) and has never been run below 3.12, so neither a wider Python floor nor another operating system is a
# claim this project can make.
requires-python = ">=3.12"
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.15,<2",
    "cyvcf2>=0.31.4",
    "google-cloud-bigquery>=3.40.1",
    # crc32c checksums guard the dosage store's Zarr v3 shard indexes and zstd chunks.
    "google-crc32c>=1.5",
    # zstd is the dosage store's bucket codec (target-format REPORT §2.3).
    "zstandard>=0.23",
    "pandas>=1.5",
    # Stage 0's CPU backend runs single-threaded BLAS inside its own worker pool.
    "threadpoolctl>=3.1",
    # sv_pgs/mean_field.py imports numba at module level: its kernels are the small-n route's inference, so an
    # install without numba cannot fit anything.
    "numba>=0.60",
]

[project.optional-dependencies]
# CuPy loads the CUDA 12 runtime, cuBLAS, cuSOLVER (with its cuSPARSE and nvJitLink), cuRAND (cupy.random)
# and NVRTC from these wheels at run time; JAX's CUDA extra used to bring them in. Nothing calls cupy.fft, so
# cuFFT is left out. tests/test_gpu_extra_cuda.py exercises each one.
gpu = [
    "cupy-cuda12x>=13.0",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cublas-cu12",
    "nvidia-cusolver-cu12",
    "nvidia-cusparse-cu12",
    "nvidia-curand-cu12",
    "nvidia-nvjitlink-cu12",
    "nvidia-cuda-nvrtc-cu12",
]

[project.scripts]
sv-pgs = "sv_pgs.cli:main"

[tool.setuptools.packages.find]
include = ["sv_pgs*", "benchmarks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: a test over 60 s on a CI runner; excluded from the CI shards (-m 'not slow') and run on MSI by bug-recent's periodic full run",
]

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = [
    "numpy",
    "numpy.*",
    "pytest",
    "pytest.*",
    "sklearn",
    "sklearn.*",
    "google.cloud",
    "google.cloud.*",
    "cupy",
    "cupy.*",
    "cupyx",
    "cupyx.*",
    "scipy",
    "scipy.*",
    "cyvcf2",
    "pandas",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=1.20.0",
    "vulture>=2.16",
    "pytest>=8",
    # Reference metrics (roc_auc_score, r2_score) in the tests; nothing in sv_pgs imports it.
    "scikit-learn>=1.3",
    # tests/test_all_of_us_sql.py runs the BigQuery phenotype SQL
    # on synthetic OMOP tables: sqlglot transpiles it to DuckDB.
    "duckdb>=1.1",
    "sqlglot>=30",
]
# Coalescent simulation for the team's accuracy and power studies on public data.
# Never imported by sv_pgs; install with `uv sync --group sim`.
sim = [
    "msprime>=1.3",
]
