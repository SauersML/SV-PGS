[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sv-pgs"
version = "0.1.0"
description = "Bayesian polygenic scores with structural variants, tandem repeats and SNVs in one model"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
# Tested on Linux with CPython 3.12; resource detection uses /proc and sched_getaffinity.
requires-python = ">=3.12"
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.15,<2",
    "cyvcf2>=0.31.4",
    "google-cloud-bigquery>=3.40.1",
    # crc32c checksums guard the dosage store's Zarr v3 shard indexes and zstd chunks.
    "google-crc32c>=1.5",
    # Compression for dosage-store buckets.
    "zstandard>=0.23",
    "pandas>=1.5",
    # Stage 0's CPU backend runs single-threaded BLAS inside its own worker pool.
    "threadpoolctl>=3.1",
    # CPU inference kernels; required even without the GPU extra.
    "numba>=0.60",
    # The prior's annotation smooths: B-spline bases and their exact derivative roughness penalties (gamfit.basis).
    "gamfit==0.1.272",
    # Persist runs across Batch jobs through the workspace bucket.
    "google-cloud-storage>=2.18",
]

[project.optional-dependencies]
# CUDA 12 libraries used by CuPy; exercised by tests/test_gpu_extra_cuda.py.
gpu = [
    "cupy-cuda12x>=13.0",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cublas-cu12",
    "nvidia-cusolver-cu12",
    "nvidia-cusparse-cu12",
    "nvidia-curand-cu12",
    "nvidia-nvjitlink-cu12",
    "nvidia-cuda-nvrtc-cu12",
]

[project.scripts]
sv-pgs = "sv_pgs.cli:main"

[tool.setuptools.packages.find]
include = ["sv_pgs*", "benchmarks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: a test over 60 s on a CI runner; excluded from the CI shards (-m 'not slow') and run on MSI by bug-recent's periodic full run",
]

[dependency-groups]
dev = [
    "vulture>=2.16",
    "pytest>=8",
    # Reference metrics (roc_auc_score, r2_score) in the tests; nothing in sv_pgs imports it.
    "scikit-learn>=1.3",
    # tests/test_all_of_us_sql.py runs the BigQuery phenotype SQL
    # on synthetic OMOP tables: sqlglot transpiles it to DuckDB.
    "duckdb>=1.1",
    "sqlglot>=30",
]
